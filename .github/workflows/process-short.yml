name: Process phone submission

on:
  repository_dispatch:
    types: [shorts_submission]

permissions:
  contents: read

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      YOUTUBE_GOLDENBOOT_TOKEN_JSON: ${{ secrets.YOUTUBE_GOLDENBOOT_TOKEN_JSON }}
      YOUTUBE_LIFES_HIGHLIGHTS_TOKEN_JSON: ${{ secrets.YOUTUBE_LIFES_HIGHLIGHTS_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          python -m pip install -r requirements.txt
      - name: Render and upload
        env:
          CLIP_3_FILE_ID: ${{ github.event.client_payload.clip_3_file_id }}
          CLIP_2_FILE_ID: ${{ github.event.client_payload.clip_2_file_id }}
          LABEL_3: ${{ github.event.client_payload.label_3 }}
          LABEL_2: ${{ github.event.client_payload.label_2 }}
          TOPIC: ${{ github.event.client_payload.topic }}
          CHANNEL: ${{ github.event.client_payload.channel }}
          PUBLIC_APPROVAL: ${{ github.event.client_payload.public_approval }}
        run: python scripts/process_submission.py
