name: Venu Forward Paper

on:
  push:
    branches: [venu-hybrid-backtester]
    paths:
      - 'venu_backtester/PAPER_HEARTBEAT.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forward-paper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: venu-hybrid-backtester
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: venu_backtester
        run: pip install -r requirements-cloud.txt
      - name: Run forward paper logger
        working-directory: venu_backtester
        run: python forward_paper.py
      - name: Persist paper state and ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add venu_backtester/forward_paper_state.json venu_backtester/forward_paper_ledger.csv
          if git diff --cached --quiet; then
            echo 'No forward-paper changes to commit.'
          else
            git commit -m 'Update Venu forward paper state [skip ci]'
            git push origin HEAD:venu-hybrid-backtester
          fi
