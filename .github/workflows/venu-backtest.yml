name: Venu Backtest Cloud
on:
  push:
    branches: [venu-hybrid-backtester]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: venu_backtester
        run: pip install -r requirements-cloud.txt
      - name: Run historical backtest
        working-directory: venu_backtester
        run: python cloud_backtest.py
      - name: Run robust strategy search
        working-directory: venu_backtester
        run: python robust_strategy_search.py
      - name: Run conservative consistency search
        working-directory: venu_backtester
        run: python conservative_strategy_search.py
      - name: Run fixed candidate gate
        working-directory: venu_backtester
        run: python fixed_candidate.py
      - name: Run forward paper test
        working-directory: venu_backtester
        run: python forward_paper.py
      - name: Persist forward paper state
        if: github.ref == 'refs/heads/venu-hybrid-backtester' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venu_backtester/forward_paper_state.json venu_backtester/forward_paper_ledger.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update forward paper state [skip ci]"
            git push origin HEAD:venu-hybrid-backtester
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: venu-backtest-results
          path: |
            venu_backtester/summary.json
            venu_backtester/metrics.csv
            venu_backtester/walk_forward_results.csv
            venu_backtester/oos_returns.csv
            venu_backtester/prices.csv
            venu_backtester/price_failures.json
            venu_backtester/strategy_family_windows.csv
            venu_backtester/strategy_family_summary.csv
            venu_backtester/ensemble_oos_returns.csv
            venu_backtester/strategy_search_summary.json
            venu_backtester/conservative_windows.csv
            venu_backtester/conservative_summary.csv
            venu_backtester/conservative_ensemble_oos.csv
            venu_backtester/conservative_summary.json
            venu_backtester/candidate_stress.csv
            venu_backtester/candidate_gate.csv
            venu_backtester/candidate_returns.csv
            venu_backtester/candidate_summary.json
            venu_backtester/forward_paper_state.json
            venu_backtester/forward_paper_ledger.csv
          if-no-files-found: error
