name: Venu Backtest Cloud
on:
  push:
    branches: [venu-hybrid-backtester]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: venu_backtester
        run: pip install -r requirements-cloud.txt
      - name: Run historical backtest
        working-directory: venu_backtester
        run: python cloud_backtest.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: venu-backtest-results
          path: |
            venu_backtester/summary.json
            venu_backtester/metrics.csv
            venu_backtester/walk_forward_results.csv
            venu_backtester/oos_returns.csv
            venu_backtester/prices.csv
            venu_backtester/price_failures.json
          if-no-files-found: error
